name: wwww

on:
  workflow_dispatch:
permissions:
  id-token: write
jobs:
  rdp:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set strong password for current user
      shell: powershell
      run: |
        Write-Host "Changing password for user: $user"
        net user runneradmin 1qaz@WSX

        # 确保允许 RDP
        Set-ItemProperty `
          -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
          -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    # 中文输入法（微软拼音）。用 Windows PowerShell 5.1 跑：International /
    # LanguagePackManagement 是 Windows PowerShell 模块，PS7 下需要隐式远程。
    # 脚本正文保持纯 ASCII，避免 5.1 读取无 BOM 脚本时的编码问题。
    - name: Install Chinese input method (Microsoft Pinyin)
      shell: powershell
      run: |
        $ErrorActionPreference = "Continue"
        $lang = "zh-CN"

        # Microsoft Pinyin input tip: 0804 = zh-CN keyboard layout, first GUID = IME
        # CLSID, second GUID = language profile. Verified present under
        # HKLM:\SOFTWARE\Microsoft\CTF\TIP\{81D4E9C9-...}\LanguageProfile\0x00000804
        $pinyinTip = "0804:{81D4E9C9-1D3B-41BC-9E6C-4B40BF79E35E}{FA550B04-5AD7-411F-A5AC-CA038EC515D7}"

        Write-Host "=== 1/4 install zh-CN language pack and basic typing FOD (IME + dictionaries) ==="
        $packOk = $false
        try {
          # No -CopyToSettings: keep the English system UI, add Chinese input only.
          Install-Language -Language $lang -ErrorAction Stop
          $packOk = $true
          Write-Host "Install-Language $lang : OK"
        } catch {
          Write-Host "Install-Language $lang failed: $($_.Exception.Message)"
        }

        if (-not $packOk) {
          # Fallback: install the Features on Demand directly. On Windows Server the
          # Chinese IME dictionaries live in Language.Basic (basic typing).
          foreach ($cap in @("Language.Basic~~~$lang~0.0.1.0", "Language.Fonts.Hans~~~und-CHS~0.0.1.0")) {
            try {
              $c = Get-WindowsCapability -Online -Name $cap -ErrorAction Stop
              if ($c.State -ne "Installed") {
                Add-WindowsCapability -Online -Name $cap -ErrorAction Stop | Out-Null
              }
              Write-Host "capability $cap : OK"
            } catch {
              Write-Host "capability $cap failed: $($_.Exception.Message)"
            }
          }
        }

        Write-Host "=== 2/4 add zh-CN (Microsoft Pinyin) to the current user language list ==="
        try {
          $list = New-WinUserLanguageList -Language "en-US"
          $chinese = New-WinUserLanguageList -Language $lang
          $chinese[0].InputMethodTips.Clear()
          $chinese[0].InputMethodTips.Add($pinyinTip)
          $list.Add($chinese[0])
          Set-WinUserLanguageList -LanguageList $list -Force
          Write-Host "language list written: en-US (default) + $lang (Microsoft Pinyin)"
        } catch {
          Write-Host "Set-WinUserLanguageList failed: $($_.Exception.Message)"
        }

        Write-Host "=== 3/4 register the input indicator (ctfmon) for the RDP session ==="
        try {
          $runKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          if (-not (Test-Path $runKey)) { New-Item -Path $runKey -Force | Out-Null }
          Set-ItemProperty -Path $runKey -Name "CTFMon" -Value "ctfmon.exe" -Force
          if (-not (Get-Process -Name ctfmon -ErrorAction SilentlyContinue)) {
            Start-Process -FilePath "$env:SystemRoot\System32\ctfmon.exe" -ErrorAction SilentlyContinue
          }
          Write-Host "ctfmon autostart registered"
        } catch {
          Write-Host "ctfmon setup failed: $($_.Exception.Message)"
        }

        Write-Host "=== 4/4 verify ==="
        try {
          $capState = (Get-WindowsCapability -Online -Name "Language.Basic~~~$lang~0.0.1.0" -ErrorAction Stop).State
          Write-Host "Language.Basic~~~$lang state: $capState"
          if ($capState -ne "Installed") {
            Write-Host "WARNING: basic typing FOD is not installed; on Windows Server the IME dictionaries may show as 'not ready yet'."
          }
        } catch {
          Write-Host "capability state query failed: $($_.Exception.Message)"
        }

        $check = Get-WinUserLanguageList
        foreach ($entry in $check) {
          Write-Host ("  entry: {0} | {1} | {2}" -f $entry.LanguageTag, $entry.Autonym, ($entry.InputMethodTips -join ' ; '))
        }

        $ok = $check | Where-Object { $_.LanguageTag -eq $lang -and $_.InputMethodTips.Count -gt 0 }
        if (-not $ok) {
          throw "Chinese input method setup failed: zh-CN is missing from the user language list or has no input method entry."
        }
        Write-Host "Chinese input method ready: after RDP login press Win+Space to switch to Microsoft Pinyin."

    - name: Download 
      shell: powershell
      run: |
        Invoke-WebRequest `
          -Uri https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe `
          -OutFile cloudflared.exe
    - name: Start cloudflared and send URL to webhook
      shell: pwsh
      env:
        WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      run: |
        $ErrorActionPreference = "Stop"

        # 隧道地址只投递到 webhook：不写 console、不写 notice、不写 step summary
        if (-not $env:WEBHOOK_URL) {
          Write-Error "WEBHOOK_URL is not configured; refusing to start because the tunnel URL could not be delivered"
        }

        # 日志文件（只在 runner 本地）
        $log = "$PWD\cloudflared.log"

        # Start cloudflared in a separate process so this step can finish.
        $command = "& '$PWD\cloudflared.exe' tunnel --url tcp://localhost:3389 *> '$log'"
        $process = Start-Process `
          -FilePath "pwsh" `
          -ArgumentList @("-NoProfile", "-Command", $command) `
          -WindowStyle Hidden `
          -PassThru

        "CLOUDFLARED_PID=$($process.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append

        # 等待 trycloudflare URL
        $url = $null
        for ($i = 0; $i -lt 60; $i++) {
          Start-Sleep 1
          if (Test-Path $log) {
            $regex = [regex]'https://[^\s]+\.trycloudflare\.com'
            $match = Select-String -Path $log -Pattern $regex | Select-Object -First 1
            if ($match) {
              $url = $match.Matches[0].Value
              break
            }
          }
        }

        if (-not $url) {
          Write-Error "Failed to obtain trycloudflare URL"
        }

        $payload = @{
          text       = "Windows RDP tunnel: $url"
          url        = $url
          repository = $env:GITHUB_REPOSITORY
          run_id     = $env:GITHUB_RUN_ID
          run_url    = "$($env:GITHUB_SERVER_URL)/$($env:GITHUB_REPOSITORY)/actions/runs/$($env:GITHUB_RUN_ID)"
        } | ConvertTo-Json -Compress

        # 只投递到 webhook；重试 3 次，全部失败就 fail 掉 job（避免地址静默丢失）
        $sent = $false
        for ($attempt = 1; $attempt -le 3 -and -not $sent; $attempt++) {
          try {
            Invoke-RestMethod -Method Post `
              -Uri $env:WEBHOOK_URL `
              -ContentType 'application/json' `
              -Body $payload `
              -TimeoutSec 30 | Out-Null
            $sent = $true
          } catch {
            $status = $null
            if ($_.Exception.Response) { $status = [int]$_.Exception.Response.StatusCode }
            Write-Host "Webhook delivery attempt $attempt failed (HTTP status: $status)."
            if ($attempt -lt 3) { Start-Sleep -Seconds 5 }
          }
        }

        if (-not $sent) {
          Write-Error "Failed to deliver the tunnel URL to the webhook after 3 attempts"
        }

        Write-Host "Tunnel URL delivered to the webhook (it is intentionally not printed to the console)."

    - name: Keep runner alive
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        if ($env:CLOUDFLARED_PID) {
          Write-Host "cloudflared process id: $env:CLOUDFLARED_PID"
        }

        Write-Host "RDP is ready. Keeping runner alive..."
        while ($true) {
          Start-Sleep -Seconds 300
        }
