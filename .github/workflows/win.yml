name: wwww

on:
  workflow_dispatch:
permissions:
  id-token: write
jobs:
  rdp:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set strong password for current user
      shell: powershell
      run: |
        Write-Host "Changing password for user: $user"
        net user runneradmin 1qaz@WSX

        # 确保允许 RDP
        Set-ItemProperty `
          -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
          -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Download 
      shell: powershell
      run: |
        Invoke-WebRequest `
          -Uri https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe `
          -OutFile cloudflared.exe
    - name: Start cloudflared and send URL to webhook
      shell: pwsh
      env:
        WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      run: |
        $ErrorActionPreference = "Stop"

        # 隧道地址只投递到 webhook：不写 console、不写 notice、不写 step summary
        if (-not $env:WEBHOOK_URL) {
          Write-Error "WEBHOOK_URL is not configured; refusing to start because the tunnel URL could not be delivered"
        }

        # 日志文件（只在 runner 本地）
        $log = "$PWD\cloudflared.log"

        # Start cloudflared in a separate process so this step can finish.
        $command = "& '$PWD\cloudflared.exe' tunnel --url tcp://localhost:3389 *> '$log'"
        $process = Start-Process `
          -FilePath "pwsh" `
          -ArgumentList @("-NoProfile", "-Command", $command) `
          -WindowStyle Hidden `
          -PassThru

        "CLOUDFLARED_PID=$($process.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append

        # 等待 trycloudflare URL
        $url = $null
        for ($i = 0; $i -lt 60; $i++) {
          Start-Sleep 1
          if (Test-Path $log) {
            $regex = [regex]'https://[^\s]+\.trycloudflare\.com'
            $match = Select-String -Path $log -Pattern $regex | Select-Object -First 1
            if ($match) {
              $url = $match.Matches[0].Value
              break
            }
          }
        }

        if (-not $url) {
          Write-Error "Failed to obtain trycloudflare URL"
        }

        $payload = @{
          text       = "Windows RDP tunnel: $url"
          url        = $url
          repository = $env:GITHUB_REPOSITORY
          run_id     = $env:GITHUB_RUN_ID
          run_url    = "$($env:GITHUB_SERVER_URL)/$($env:GITHUB_REPOSITORY)/actions/runs/$($env:GITHUB_RUN_ID)"
        } | ConvertTo-Json -Compress

        # 只投递到 webhook；重试 3 次，全部失败就 fail 掉 job（避免地址静默丢失）
        $sent = $false
        for ($attempt = 1; $attempt -le 3 -and -not $sent; $attempt++) {
          try {
            Invoke-RestMethod -Method Post `
              -Uri $env:WEBHOOK_URL `
              -ContentType 'application/json' `
              -Body $payload `
              -TimeoutSec 30 | Out-Null
            $sent = $true
          } catch {
            $status = $null
            if ($_.Exception.Response) { $status = [int]$_.Exception.Response.StatusCode }
            Write-Host "Webhook delivery attempt $attempt failed (HTTP status: $status)."
            if ($attempt -lt 3) { Start-Sleep -Seconds 5 }
          }
        }

        if (-not $sent) {
          Write-Error "Failed to deliver the tunnel URL to the webhook after 3 attempts"
        }

        Write-Host "Tunnel URL delivered to the webhook (it is intentionally not printed to the console)."

    - name: Keep runner alive
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        if ($env:CLOUDFLARED_PID) {
          Write-Host "cloudflared process id: $env:CLOUDFLARED_PID"
        }

        Write-Host "RDP is ready. Keeping runner alive..."
        while ($true) {
          Start-Sleep -Seconds 300
        }
