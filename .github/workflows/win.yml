name: wwww

on:
  workflow_dispatch:
permissions:
  id-token: write
jobs:
  rdp:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set strong password for current user
      shell: powershell
      run: |
        Write-Host "Changing password for user: $user"
        net user runneradmin 1qaz@WSX

        # 确保允许 RDP
        Set-ItemProperty `
          -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
          -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    # 中文输入法。实测事实（windows-2025-vs2026 = Server 2025 26100）：
    #  1) 镜像自带微软拼音引擎（System32\InputMethod\CHS\ChsIME.exe）与 TIP 注册，但简体词典
    #     来自 'basic typing' FOD（Language.Basic~~~zh-CN）：该镜像 NotPresent，且下载通道不可用
    #     （Install-Language 无输出卡死 28 分钟；Add-WindowsCapability 240 秒零进展）。
    #     没有词典，微软拼音无法把拼音转成汉字，所以真正能用的是自带词典的 RIME 小狼毫。
    #  2) 小狼毫官方安装器：NSIS /S = 完全静默，并映射成 WeaselSetup /s（简体配置），
    #     静默模式下自动跑 WeaselDeployer /deploy（见 output/install.nsi 292-323 行）。
    #  3) shell 必须是 Windows PowerShell 5.1：International / LanguagePackManagement 是
    #     Windows PowerShell 模块，PS7 下要隐式远程。正文保持纯 ASCII。
    # 整步 timeout-minutes + continue-on-error：这一步永远不会拖住后面的 RDP 步骤。
    - name: Chinese input method (RIME Weasel, bounded)
      shell: powershell
      timeout-minutes: 10
      continue-on-error: true
      env:
        WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      run: |
        $ErrorActionPreference = "Continue"
        $lang = "zh-CN"
        $pinyinTip = "0804:{81D4E9C9-1D3B-41BC-9E6C-4B40BF79E35E}{FA550B04-5AD7-411F-A5AC-CA038EC515D7}"
        $weaselUrl = "https://github.com/rime/weasel/releases/download/0.17.4/weasel-0.17.4.0-installer.exe"
        $rimeUser = Join-Path $env:APPDATA "Rime"
        function Say($m) { Write-Host ("[{0:HH:mm:ss}] {1}" -f (Get-Date), $m) }

        Say "=== 1/5 does this image ship the Simplified Chinese lexicons? ==="
        $msLexicon = $false
        try {
          $msLexicon = [bool](Get-ChildItem "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Component Based Servicing\Packages" -ErrorAction Stop |
            Where-Object { $_.PSChildName -like "*LanguageFeatures-Basic-zh-*" } | Select-Object -First 1)
        } catch {
          Say ("lexicon probe failed: " + $_.Exception.Message)
        }
        Say ("basic typing FOD for zh-CN installed: " + $msLexicon)

        Say "=== 2/5 RIME Weasel (self-contained dictionaries, no Windows Update) ==="
        $weasel = Get-ChildItem "$env:ProgramFiles\Rime" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($weasel) {
          Say ("already installed: " + $weasel.FullName)
        } else {
          # The schema selection has to exist BEFORE the installer runs, so that its own
          # silent WeaselDeployer /deploy compiles it (no second deploy needed).
          New-Item -ItemType Directory -Force -Path $rimeUser | Out-Null
          $cfgPath = Join-Path $rimeUser "default.custom.yaml"
          if (-not (Test-Path -LiteralPath $cfgPath)) {
            $cfg = "patch:`n  schema_list:`n    - schema: luna_pinyin_simp`n"
            [System.IO.File]::WriteAllText($cfgPath, $cfg, (New-Object System.Text.UTF8Encoding($false)))
            Say ("pre-wrote " + $cfgPath + " -> luna_pinyin_simp (simplified output)")
          }
          $exe = Join-Path $env:TEMP "weasel-installer.exe"
          try {
            Invoke-WebRequest -Uri $weaselUrl -OutFile $exe -UseBasicParsing -TimeoutSec 180
            Say ("downloaded RIME installer: " + [int]((Get-Item -LiteralPath $exe).Length / 1MB) + " MB")
            $p = Start-Process -FilePath $exe -ArgumentList "/S" -PassThru -WindowStyle Hidden
            $null = Wait-Process -Id $p.Id -Timeout 300 -ErrorAction SilentlyContinue
            if ($p.HasExited) {
              Say ("RIME installer exit code: " + $p.ExitCode)
            } else {
              try { $p.Kill() } catch {}
              Say "RIME installer timed out after 300s"
            }
          } catch {
            Say ("RIME install failed: " + $_.Exception.Message)
          }
          $weasel = Get-ChildItem "$env:ProgramFiles\Rime" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
        }

        Say "=== 3/5 discover the RIME TSF tip registered for zh-CN ==="
        $weaselTip = $null
        foreach ($k in (Get-ChildItem "HKLM:\SOFTWARE\Microsoft\CTF\TIP" -ErrorAction SilentlyContinue)) {
          $clsid = $k.PSChildName
          $dll = (Get-ItemProperty "HKLM:\SOFTWARE\Classes\CLSID\$clsid\InprocServer32" -ErrorAction SilentlyContinue).'(default)'
          if ($dll -and $dll -match "weasel") {
            $profiles = Join-Path $k.PSPath "LanguageProfile\0x00000804"
            if (Test-Path -LiteralPath $profiles) {
              $prof = Get-ChildItem $profiles -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($prof) { $weaselTip = "0804:" + $clsid + $prof.PSChildName }
            }
          }
        }
        Say ("RIME tip for zh-CN: " + $weaselTip)

        Say "=== 4/5 user language list (en-US default + usable Chinese IMEs) ==="
        try {
          $list = New-WinUserLanguageList -Language "en-US"
          $chinese = New-WinUserLanguageList -Language $lang
          if ($msLexicon -or $weaselTip) { $chinese[0].InputMethodTips.Clear() }
          if ($msLexicon) { $chinese[0].InputMethodTips.Add($pinyinTip) }
          if ($weaselTip) { $chinese[0].InputMethodTips.Add($weaselTip) }
          $list.Add($chinese[0])
          Set-WinUserLanguageList -LanguageList $list -Force
          Say "language list written"
        } catch {
          Say ("Set-WinUserLanguageList failed: " + $_.Exception.Message)
        }

        Say "=== 5/5 input indicator (ctfmon) + summary ==="
        try {
          $runKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          if (-not (Test-Path $runKey)) { New-Item -Path $runKey -Force | Out-Null }
          Set-ItemProperty -Path $runKey -Name "CTFMon" -Value "ctfmon.exe" -Force
          if (-not (Get-Process -Name ctfmon -ErrorAction SilentlyContinue)) {
            Start-Process -FilePath "$env:SystemRoot\System32\ctfmon.exe" -ErrorAction SilentlyContinue
          }
          Say "ctfmon autostart registered"
        } catch {
          Say ("ctfmon setup failed: " + $_.Exception.Message)
        }

        $check = Get-WinUserLanguageList
        foreach ($e in $check) {
          Say ("  " + $e.LanguageTag + " | " + $e.Autonym + " | " + ($e.InputMethodTips -join " ; "))
        }
        $schemaList = "n/a"
        $buildDefault = Join-Path $rimeUser "build\default.yaml"
        if (Test-Path -LiteralPath $buildDefault) {
          $schemaList = ((Select-String -Path $buildDefault -Pattern "^\s*- schema: (\S+)" -ErrorAction SilentlyContinue |
            ForEach-Object { $_.Matches[0].Groups[1].Value }) -join ",")
        }
        Say ("effective RIME schema_list: " + $schemaList)

        $ready = [bool]($check | Where-Object { $_.LanguageTag -eq $lang -and $_.InputMethodTips.Count -gt 0 })
        Say ("RESULT: " + $(if ($ready) { "Chinese IME registered (Win+Space -> RIME/Weasel)." } else { "no Chinese IME could be prepared." }))
        Say "This step never fails the job: RDP access matters more than the input method."

        if ($env:WEBHOOK_URL) {
          try {
            $body = @{
              text        = "IME: ready=" + $ready + " rime_tip=" + $weaselTip + " schema_list=" + $schemaList + " ms_lexicon=" + $msLexicon
              ime_ready   = $ready
              rime_tip    = $weaselTip
              schema_list = $schemaList
              ms_lexicon  = $msLexicon
            } | ConvertTo-Json -Compress
            Invoke-RestMethod -Method Post -Uri $env:WEBHOOK_URL -ContentType "application/json" -Body $body -TimeoutSec 30 | Out-Null
            Say "IME status reported to the webhook"
          } catch {
            Say ("webhook report failed: " + $_.Exception.Message)
          }
        }

    - name: Download 
      shell: powershell
      run: |
        Invoke-WebRequest `
          -Uri https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe `
          -OutFile cloudflared.exe
    - name: Start cloudflared and send URL to webhook
      shell: pwsh
      env:
        WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      run: |
        $ErrorActionPreference = "Stop"

        # 隧道地址只投递到 webhook：不写 console、不写 notice、不写 step summary
        if (-not $env:WEBHOOK_URL) {
          Write-Error "WEBHOOK_URL is not configured; refusing to start because the tunnel URL could not be delivered"
        }

        # 日志文件（只在 runner 本地）
        $log = "$PWD\cloudflared.log"

        # Start cloudflared in a separate process so this step can finish.
        $command = "& '$PWD\cloudflared.exe' tunnel --url tcp://localhost:3389 *> '$log'"
        $process = Start-Process `
          -FilePath "pwsh" `
          -ArgumentList @("-NoProfile", "-Command", $command) `
          -WindowStyle Hidden `
          -PassThru

        "CLOUDFLARED_PID=$($process.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append

        # 等待 trycloudflare URL
        $url = $null
        for ($i = 0; $i -lt 60; $i++) {
          Start-Sleep 1
          if (Test-Path $log) {
            $regex = [regex]'https://[^\s]+\.trycloudflare\.com'
            $match = Select-String -Path $log -Pattern $regex | Select-Object -First 1
            if ($match) {
              $url = $match.Matches[0].Value
              break
            }
          }
        }

        if (-not $url) {
          Write-Error "Failed to obtain trycloudflare URL"
        }

        $payload = @{
          text       = "Windows RDP tunnel: $url"
          url        = $url
          repository = $env:GITHUB_REPOSITORY
          run_id     = $env:GITHUB_RUN_ID
          run_url    = "$($env:GITHUB_SERVER_URL)/$($env:GITHUB_REPOSITORY)/actions/runs/$($env:GITHUB_RUN_ID)"
        } | ConvertTo-Json -Compress

        # 只投递到 webhook；重试 3 次，全部失败就 fail 掉 job（避免地址静默丢失）
        $sent = $false
        for ($attempt = 1; $attempt -le 3 -and -not $sent; $attempt++) {
          try {
            Invoke-RestMethod -Method Post `
              -Uri $env:WEBHOOK_URL `
              -ContentType 'application/json' `
              -Body $payload `
              -TimeoutSec 30 | Out-Null
            $sent = $true
          } catch {
            $status = $null
            if ($_.Exception.Response) { $status = [int]$_.Exception.Response.StatusCode }
            Write-Host "Webhook delivery attempt $attempt failed (HTTP status: $status)."
            if ($attempt -lt 3) { Start-Sleep -Seconds 5 }
          }
        }

        if (-not $sent) {
          Write-Error "Failed to deliver the tunnel URL to the webhook after 3 attempts"
        }

        Write-Host "Tunnel URL delivered to the webhook (it is intentionally not printed to the console)."

    - name: Keep runner alive
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        if ($env:CLOUDFLARED_PID) {
          Write-Host "cloudflared process id: $env:CLOUDFLARED_PID"
        }

        Write-Host "RDP is ready. Keeping runner alive..."
        while ($true) {
          Start-Sleep -Seconds 300
        }
