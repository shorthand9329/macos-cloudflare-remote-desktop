name: wwww

on:
  workflow_dispatch:
permissions:
  id-token: write
jobs:
  rdp:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set strong password for current user
      shell: powershell
      run: |
        Write-Host "Changing password for user: $user"
        net user runneradmin 1qaz@WSX

        # 确保允许 RDP
        Set-ItemProperty `
          -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
          -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    # 中文输入法（微软拼音）。三条经验：
    #  1) shell 必须是 Windows PowerShell 5.1：International / LanguagePackManagement
    #     是 Windows PowerShell 模块，PS7 下需要隐式远程。正文保持纯 ASCII。
    #  2) Install-Language 在托管 runner 上会卡死在 Windows Update（实测 08:57→09:25
    #     整整 28 分钟零输出、无异常），所以它只能带硬超时跑，整步还要 timeout-minutes
    #     兜底，并且 continue-on-error，否则后面的 RDP 步骤会被默认的 if: success() 跳过。
    #  3) 只做只读探测 + 注册语言列表；不调用 Get-WindowsCapability/Add-WindowsCapability
    #     （同样走 Windows Update / DISM，同样会挂）。
    - name: Chinese input method (Microsoft Pinyin, bounded)
      shell: powershell
      timeout-minutes: 6
      continue-on-error: true
      run: |
        $ErrorActionPreference = "Continue"
        $lang = "zh-CN"

        # Microsoft Pinyin input tip: 0804 = zh-CN keyboard layout, first GUID = IME
        # CLSID, second GUID = language profile.
        $pinyinTip = "0804:{81D4E9C9-1D3B-41BC-9E6C-4B40BF79E35E}{FA550B04-5AD7-411F-A5AC-CA038EC515D7}"
        $pinyinKey = "HKLM:\SOFTWARE\Microsoft\CTF\TIP\{81D4E9C9-1D3B-41BC-9E6C-4B40BF79E35E}\LanguageProfile\0x00000804\{FA550B04-5AD7-411F-A5AC-CA038EC515D7}"
        $packTimeoutSec = 180
        function Say($m) { Write-Host ("[{0:HH:mm:ss}] {1}" -f (Get-Date), $m) }

        Say "=== 1/5 inventory (read-only, no Windows Update calls) ==="
        Say ("Microsoft Pinyin TIP already registered: {0}" -f (Test-Path $pinyinKey))
        foreach ($p in @("$env:SystemRoot\System32\CHSIME.EXE", "$env:SystemRoot\System32\InputMethod\CHS\ChsIME.exe")) {
          Say ("file {0} : {1}" -f $p, (Test-Path $p))
        }
        try {
          foreach ($l in (Get-InstalledLanguage)) { Say ("installed language: {0}" -f $l.LanguageId) }
        } catch {
          Say ("Get-InstalledLanguage failed: {0}" -f $_.Exception.Message)
        }
        foreach ($e in (Get-WinUserLanguageList)) {
          Say ("user language: {0} ({1}) tips={2}" -f $e.LanguageTag, $e.Autonym, ($e.InputMethodTips -join ','))
        }

        Say "=== 2/5 Windows Update stack (best effort) ==="
        foreach ($n in @("wuauserv", "UsoSvc", "BITS", "DoSvc")) {
          try {
            Set-Service -Name $n -StartupType Manual -ErrorAction Stop
            Start-Service -Name $n -ErrorAction Stop
            Say ("{0}: {1}" -f $n, (Get-Service -Name $n).Status)
          } catch {
            Say ("{0}: cannot start - {1}" -f $n, $_.Exception.Message)
          }
        }

        Say "=== 3/5 bounded pack install (max ${packTimeoutSec}s, then give up) ==="
        if (Test-Path $pinyinKey) {
          Say "Pinyin IME files are already on this image; nothing to download."
        } else {
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $job = Start-Job -ScriptBlock { param($l) Install-Language -Language $l -ErrorAction Stop } -ArgumentList $lang
          $finished = Wait-Job -Job $job -Timeout $packTimeoutSec
          if ($finished) {
            try {
              Receive-Job -Job $job -ErrorAction Stop | Out-Null
              Say ("Install-Language completed in {0}s" -f [int]$sw.Elapsed.TotalSeconds)
            } catch {
              Say ("Install-Language failed after {0}s: {1}" -f [int]$sw.Elapsed.TotalSeconds, $_.Exception.Message)
            }
          } else {
            Say ("Install-Language produced nothing in {0}s -> abandoned (known hang: it waits on Windows Update forever)." -f $packTimeoutSec)
          }
          Stop-Job -Job $job -ErrorAction SilentlyContinue
          Remove-Job -Job $job -Force -ErrorAction SilentlyContinue
          Say ("Pinyin TIP registered after the attempt: {0}" -f (Test-Path $pinyinKey))
        }

        Say "=== 4/5 register zh-CN for the current user ==="
        try {
          $list = New-WinUserLanguageList -Language "en-US"
          $chinese = New-WinUserLanguageList -Language $lang
          if (Test-Path $pinyinKey) {
            $chinese[0].InputMethodTips.Clear()
            $chinese[0].InputMethodTips.Add($pinyinTip)
          } else {
            Say "Pinyin TIP is missing, so the zh-CN entry keeps its default input methods only."
          }
          $list.Add($chinese[0])
          Set-WinUserLanguageList -LanguageList $list -Force
          Say "language list written: en-US (default) + $lang"
        } catch {
          Say ("Set-WinUserLanguageList failed: {0}" -f $_.Exception.Message)
        }

        Say "=== 5/5 input indicator (ctfmon) ==="
        try {
          $runKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          if (-not (Test-Path $runKey)) { New-Item -Path $runKey -Force | Out-Null }
          Set-ItemProperty -Path $runKey -Name "CTFMon" -Value "ctfmon.exe" -Force
          if (-not (Get-Process -Name ctfmon -ErrorAction SilentlyContinue)) {
            Start-Process -FilePath "$env:SystemRoot\System32\ctfmon.exe" -ErrorAction SilentlyContinue
          }
          Say "ctfmon autostart registered"
        } catch {
          Say ("ctfmon setup failed: {0}" -f $_.Exception.Message)
        }

        Say "=== summary ==="
        $check = Get-WinUserLanguageList
        foreach ($e in $check) {
          Say ("  {0} | {1} | {2}" -f $e.LanguageTag, $e.Autonym, ($e.InputMethodTips -join ' ; '))
        }
        $imeReady = (Test-Path $pinyinKey) -and [bool]($check | Where-Object { $_.LanguageTag -eq $lang -and $_.InputMethodTips.Count -gt 0 })
        if ($imeReady) {
          Say "RESULT: Microsoft Pinyin is registered. After RDP login press Win+Space."
        } else {
          Say "RESULT: Microsoft Pinyin is NOT usable on this image."
          Say "        The zh-CN entry may exist, but the IME files/dictionaries come from the"
          Say "        'basic typing' FOD, which this image does not ship and cannot download"
          Say "        (Windows Update hangs). Switch this step to a download-based IME (RIME/Weasel)."
        }
        Say "This step deliberately never fails the job: RDP access matters more than the input method."

    - name: Download 
      shell: powershell
      run: |
        Invoke-WebRequest `
          -Uri https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe `
          -OutFile cloudflared.exe
    - name: Start cloudflared and send URL to webhook
      shell: pwsh
      env:
        WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      run: |
        $ErrorActionPreference = "Stop"

        # 隧道地址只投递到 webhook：不写 console、不写 notice、不写 step summary
        if (-not $env:WEBHOOK_URL) {
          Write-Error "WEBHOOK_URL is not configured; refusing to start because the tunnel URL could not be delivered"
        }

        # 日志文件（只在 runner 本地）
        $log = "$PWD\cloudflared.log"

        # Start cloudflared in a separate process so this step can finish.
        $command = "& '$PWD\cloudflared.exe' tunnel --url tcp://localhost:3389 *> '$log'"
        $process = Start-Process `
          -FilePath "pwsh" `
          -ArgumentList @("-NoProfile", "-Command", $command) `
          -WindowStyle Hidden `
          -PassThru

        "CLOUDFLARED_PID=$($process.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append

        # 等待 trycloudflare URL
        $url = $null
        for ($i = 0; $i -lt 60; $i++) {
          Start-Sleep 1
          if (Test-Path $log) {
            $regex = [regex]'https://[^\s]+\.trycloudflare\.com'
            $match = Select-String -Path $log -Pattern $regex | Select-Object -First 1
            if ($match) {
              $url = $match.Matches[0].Value
              break
            }
          }
        }

        if (-not $url) {
          Write-Error "Failed to obtain trycloudflare URL"
        }

        $payload = @{
          text       = "Windows RDP tunnel: $url"
          url        = $url
          repository = $env:GITHUB_REPOSITORY
          run_id     = $env:GITHUB_RUN_ID
          run_url    = "$($env:GITHUB_SERVER_URL)/$($env:GITHUB_REPOSITORY)/actions/runs/$($env:GITHUB_RUN_ID)"
        } | ConvertTo-Json -Compress

        # 只投递到 webhook；重试 3 次，全部失败就 fail 掉 job（避免地址静默丢失）
        $sent = $false
        for ($attempt = 1; $attempt -le 3 -and -not $sent; $attempt++) {
          try {
            Invoke-RestMethod -Method Post `
              -Uri $env:WEBHOOK_URL `
              -ContentType 'application/json' `
              -Body $payload `
              -TimeoutSec 30 | Out-Null
            $sent = $true
          } catch {
            $status = $null
            if ($_.Exception.Response) { $status = [int]$_.Exception.Response.StatusCode }
            Write-Host "Webhook delivery attempt $attempt failed (HTTP status: $status)."
            if ($attempt -lt 3) { Start-Sleep -Seconds 5 }
          }
        }

        if (-not $sent) {
          Write-Error "Failed to deliver the tunnel URL to the webhook after 3 attempts"
        }

        Write-Host "Tunnel URL delivered to the webhook (it is intentionally not printed to the console)."

    - name: Keep runner alive
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        if ($env:CLOUDFLARED_PID) {
          Write-Host "cloudflared process id: $env:CLOUDFLARED_PID"
        }

        Write-Host "RDP is ready. Keeping runner alive..."
        while ($true) {
          Start-Sleep -Seconds 300
        }
