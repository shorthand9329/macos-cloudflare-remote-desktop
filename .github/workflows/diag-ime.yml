name: diag-ime

# 临时诊断：只做只读探测，不调用任何会挂起的 Windows Update / DISM 安装接口，
# 结束时立刻产出日志。用完即删。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
    - name: Probe Chinese IME availability (read-only, bounded)
      shell: powershell
      timeout-minutes: 5
      continue-on-error: true
      run: |
        $ErrorActionPreference = "Continue"
        $pinyinKey = "HKLM:\SOFTWARE\Microsoft\CTF\TIP\{81D4E9C9-1D3B-41BC-9E6C-4B40BF79E35E}\LanguageProfile\0x00000804\{FA550B04-5AD7-411F-A5AC-CA038EC515D7}"
        function Say($m) { Write-Host ("PROBE " + $m) }

        Say ("os: " + (Get-CimInstance Win32_OperatingSystem).Caption + " build " + [System.Environment]::OSVersion.Version)

        Say ("TIP key path: " + $pinyinKey)
        Say ("TIP key exists (LINUX-style Test-Path): " + (Test-Path -LiteralPath $pinyinKey))
        Say ("TIP root exists: " + (Test-Path -LiteralPath "HKLM:\SOFTWARE\Microsoft\CTF\TIP\{81D4E9C9-1D3B-41BC-9E6C-4B40BF79E35E}"))
        Say ("TIP root children: " + ((Get-ChildItem "HKLM:\SOFTWARE\Microsoft\CTF\TIP" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty PSChildName) -join ','))

        foreach ($p in @("$env:SystemRoot\System32\CHSIME.EXE", "$env:SystemRoot\System32\InputMethod\CHS\ChsIME.exe", "$env:SystemRoot\System32\InputMethod\SHARED\ChsIME.exe")) {
          Say ("file " + $p + " : " + (Test-Path -LiteralPath $p))
        }
        Say ("InputMethod dirs: " + ((Get-ChildItem "$env:SystemRoot\System32\InputMethod" -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name) -join ','))

        try { Say ("Get-InstalledLanguage: " + ((Get-InstalledLanguage | ForEach-Object { "$($_.LanguageId)" }) -join ',')) }
        catch { Say ("Get-InstalledLanguage failed: " + $_.Exception.Message) }

        try { foreach ($e in (Get-WinUserLanguageList)) { Say ("user language: " + $e.LanguageTag + " | " + $e.Autonym + " | tips=" + ($e.InputMethodTips -join ';')) } }
        catch { Say ("Get-WinUserLanguageList failed: " + $_.Exception.Message) }

        foreach ($n in @("wuauserv", "UsoSvc", "BITS", "DoSvc", "TrustedInstaller")) {
          $s = Get-Service -Name $n -ErrorAction SilentlyContinue
          Say ("service " + $n + " : " + ($(if ($s) { "$($s.Status)/$($s.StartType)" } else { "absent" })))
        }

        # bounded DISM capability query: it is the same stack as Install-Language, so cap it
        $sw = [System.Diagnostics.Stopwatch]::StartNew()
        $j = Start-Job -ScriptBlock { (Get-WindowsCapability -Online -Name "Language.Basic~~~zh-CN~0.0.1.0").State }
        $done = Wait-Job -Job $j -Timeout 90
        if ($done) {
          try { Say ("capability Language.Basic~~~zh-CN state: " + (Receive-Job -Job $j) + " (" + [int]$sw.Elapsed.TotalSeconds + "s)") }
          catch { Say ("capability query failed: " + $_.Exception.Message) }
        } else {
          Say ("capability query timed out after 90s (DISM/Windows Update stack is not responding)")
        }
        Stop-Job -Job $j -ErrorAction SilentlyContinue
        Remove-Job -Job $j -Force -ErrorAction SilentlyContinue

        Say "probe done"
